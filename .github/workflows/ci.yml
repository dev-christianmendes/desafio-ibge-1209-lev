name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Lint e testes unitários (cobertura 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache de dependências
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src desafio_ibge_1209.py tests

      - name: Testes unitários com cobertura
        run: |
          pytest -m "not e2e" \
            --cov=src \
            --cov=desafio_ibge_1209 \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=100

  commitlint:
    name: Commits semânticos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar commitlint
        run: npm ci

      - name: Validar mensagens de commit
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD~1)"
          fi
          npx commitlint --from "$BASE" --to HEAD

  sonar:
    name: Análise SonarQube
    runs-on: ubuntu-latest
    needs: qualidade
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Pulada quando token ausente
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN não configurado; etapa SonarQube pulada."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências e gerar coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          pip install -r requirements-dev.txt
          pytest -m "not e2e" \
            --cov=src \
            --cov=desafio_ibge_1209 \
            --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=100

      - uses: SonarSource/sonarqube-scan-action@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}