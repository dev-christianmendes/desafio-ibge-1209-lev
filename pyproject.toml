[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: testes de ponta a ponta contra o site real do SIDRA (requer display e rede)",
]

[tool.coverage.run]
branch = true
source = ["src", "desafio_ibge_1209"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]